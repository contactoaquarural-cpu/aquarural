<!DOCTYPE html>
<html lang="es" class="light" style="background-color: #ffffff; color: #111414;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AquaRural — Panel Administrativo</title>
    <script>
      // El panel solo tiene tema oscuro. Solo actualiza el title desde cache
      // si existe, para evitar el flash del título por defecto.
      (function () {
        try {
          var cfg = JSON.parse(localStorage.getItem('aquarural-config') || '{}');
          if (cfg.nombreAcueducto) {
            document.title = cfg.nombreAcueducto + ' — AquaRural Admin';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- Leaflet OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body class="bg-background text-on-surface" style="background-color: #ffffff; color: #111414; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
