<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GanaderoPro — Panel Administrativo</title>
    <script>
      // Aplica el tema antes del primer render para evitar flash
      (function () {
        var params = new URLSearchParams(window.location.search);
        var fromUrl = params.get('theme');
        var saved = fromUrl || localStorage.getItem('ganadero-theme');
        var isDark = saved !== 'light';
        document.documentElement.className = isDark ? 'dark' : 'light';
        // Actualiza title desde cache si existe
        try {
          var cfg = JSON.parse(localStorage.getItem('ganadero-config') || '{}');
          if (cfg.nombreAsociacion) {
            document.title = cfg.nombreAsociacion + ' — Panel Administrativo';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
