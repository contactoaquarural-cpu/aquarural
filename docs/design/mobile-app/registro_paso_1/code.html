        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .bg-editorial-gradient {
            background: linear-gradient(135deg, #1b4332 0%, #0e3727 100%);
        }
        .custom-input-focus:focus-within {
            border-bottom: 2px solid #c0ecd4;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- Top Navigation Bar (Shared Component Logic - Suppression applied as this is Transactional/Onboarding) -->
<header class="w-full px-6 py-8 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-editorial-gradient flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">agriculture</span>
</div>
<h1 class="font-headline font-extrabold text-xl tracking-tight text-on-surface">ASOGACENTRO</h1>
</div>
<button class="text-primary font-semibold text-sm hover:opacity-80 transition-opacity">
            Ayuda
        </button>
</header>
<main class="flex-1 px-6 pb-12">
<!-- Hero Section / Header -->
<section class="mb-8">
<h2 class="font-headline font-bold text-3xl text-on-surface mb-2">Únete a ASOGACENTRO</h2>
<p class="text-on-surface-variant font-body text-sm">Comienza tu registro para acceder a beneficios exclusivos del sector agropecuario.</p>
</section>
<!-- Progress Indicator -->
<div class="mb-10">
<div class="flex justify-between items-center mb-3">
<span class="font-label font-semibold text-[10px] uppercase tracking-widest text-primary">Paso 1 de 2</span>
<span class="font-label font-semibold text-[10px] uppercase tracking-widest text-on-surface-variant">Datos Personales</span>
</div>
<div class="h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-1/2 bg-editorial-gradient rounded-full"></div>
</div>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<div class="space-y-4">
<!-- Nombre Completo -->
<div class="group">
<label class="block font-label font-semibold text-[11px] uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Nombre completo</label>
<div class="relative bg-surface-container-low rounded-xl custom-input-focus transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-body" placeholder="Ej. Juan Pérez" type="text"/>
</div>
</div>
<!-- Cédula -->
<div class="group">
<label class="block font-label font-semibold text-[11px] uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Cédula de Identidad</label>
<div class="relative bg-surface-container-low rounded-xl custom-input-focus transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-body" placeholder="Número de documento" type="number"/>
</div>
</div>
<!-- Teléfono -->
<div class="group">
<label class="block font-label font-semibold text-[11px] uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Teléfono móvil</label>
<div class="relative bg-surface-container-low rounded-xl custom-input-focus transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-body" placeholder="+58 412 0000000" type="tel"/>
</div>
</div>
<!-- Correo Electrónico -->
<div class="group">
<label class="block font-label font-semibold text-[11px] uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Correo electrónico</label>
<div class="relative bg-surface-container-low rounded-xl custom-input-focus transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-body" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<!-- Contraseña -->
<div class="group">
<label class="block font-label font-semibold text-[11px] uppercase tracking-wider text-on-surface-variant mb-1.5 ml-1">Contraseña</label>
<div class="relative bg-surface-container-low rounded-xl custom-input-focus transition-all duration-200 flex items-center">
<input class="flex-1 bg-transparent border-none focus:ring-0 px-4 py-4 text-on-surface placeholder:text-outline/50 font-body" placeholder="Mínimo 8 caracteres" type="password"/>
<button class="px-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
</div>
<!-- Image/Mood Card (Editorial Detail) -->
<div class="relative h-32 rounded-2xl overflow-hidden mt-8 group">
<img alt="Fertile field" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" data-alt="Cinematic wide shot of a deep green fertile agricultural field at sunset with dramatic long shadows and golden light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXklx0ANtevPcWCRdGTwH5yBt1_xqnpJLZG6tEk3Ye_ySWFM6zTaxRiskkGUB1Jl5-h_SQh8Zv8JPpmSf_4i6S9AvW7PqwM5svQCwt-QcpUceY56OkyB0FMaNFC3g5bhawLfLW2kkJ-g64p4ZRI2zcmd3ABW2qzwU0bcgzy8STR_KRFarbWnUMc_1EX_cy-gwpsOzWSMmrA2GSFZNi3A3juVkHtpAdM0iBYJM4b_E8xxqOQYznvZWwg8ooh4GfnNmifzqdvEF6fCo"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent"></div>
<div class="absolute bottom-3 left-4">
<p class="text-[10px] font-label font-bold uppercase tracking-widest text-primary">Compromiso Rural</p>
<p class="text-xs text-on-surface/80">Impulsando el centro del país.</p>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-editorial-gradient py-5 rounded-2xl text-on-primary font-headline font-bold text-lg shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
                    Siguiente
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Link -->
<footer class="mt-8 text-center pb-8">
<p class="text-on-surface-variant text-sm font-body">
                ¿Ya tengo cuenta? 
                <a class="text-primary font-bold ml-1 hover:underline underline-offset-4" href="#">Iniciar Sesión</a>
</p>
</footer>
</main>
<!-- Bottom Navigation Bar (Shared Component Logic - Suppressed because task is Transactional) -->
</body></html>
